name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  profile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run profile unit tests
        run: node --test hooks/lib/__tests__/profile.test.mjs
      - name: Run plugin structure tests
        run: node --test tests/plugin-structure.test.mjs
      - name: Validate plugin structure
        run: |
          test -f .claude-plugin/plugin.json
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('hooks/hooks.json', 'utf8'))"
